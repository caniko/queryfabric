# Generated by simit. Manual edits will be reported as ci=drift.
name: publish-pypi
labels:
  agent: codefloe-global
  platform: linux/amd64
when:
- event: tag
steps:
- name: publish-pypi
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix develop -c maturin build --release --sdist
  - nix develop -c maturin publish --skip-existing
  environment:
    NIX_CONFIG: experimental-features = nix-command flakes
    PYPI_TOKEN:
      from_secret: PYPI_TOKEN
