[package]
name = "queryfabric-cli-toolbelt"
description = "CLI ergonomics: subprocess runner, repo-root finder, tracing init, HTTP client builders"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true

[dependencies]
arrow = { workspace = true, optional = true }
arrow-flight = { version = "58", optional = true }
base64 = "0.22"
dirs = "6"
futures = { workspace = true, optional = true }
parquet = { version = "58", default-features = false, features = ["arrow"], optional = true }
miette = { workspace = true }
polars = { version = "0.53", default-features = false, features = ["parquet", "lazy", "ipc"], optional = true }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
tonic = { version = "0.14", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
] }

[features]
default = []
flight = ["dep:arrow", "dep:arrow-flight", "dep:futures", "dep:parquet", "dep:tokio", "dep:tonic"]
polars = ["dep:polars"]

[package.metadata.cargo-udeps.ignore]
development = ["tempfile"]

[dev-dependencies]
tempfile = "3"
