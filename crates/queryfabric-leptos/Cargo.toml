[package]
name = "queryfabric-leptos"
description = "Leptos components for QueryFabric SyQL editors"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version = "1.88"
readme = "README.md"
keywords = ["sql", "leptos", "web", "frontend", "science"]
categories = ["web-programming", "gui", "science"]

[features]
default = []
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]

[dependencies]
leptos = { workspace = true }

[dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }
