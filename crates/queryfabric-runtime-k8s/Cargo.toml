[package]
name = "queryfabric-runtime-k8s"
version = "0.1.0"
description = "Kubernetes isolated execution driver for QueryFabric burst workers"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true

[features]
default = []
integration-k8s = []
snapshot-clone = []

[[test]]
name = "kind_smoke"
path = "tests/kind_smoke.rs"
required-features = ["integration-k8s"]

[dependencies]
arrow = { workspace = true }
arrow-flight = "58"
async-trait = { workspace = true }
futures = { workspace = true }
k8s-openapi = { version = "0.26.0", features = ["v1_34"] }
kube = { version = "2.0.1", features = ["client", "rustls-tls"] }
queryfabric = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tracing = { workspace = true }

[dev-dependencies]
http = "1"
serde_json = { workspace = true }
tempfile = "3"
tower-test = "0.4"

[package.metadata.cargo-udeps.ignore]
development = ["tempfile"]
