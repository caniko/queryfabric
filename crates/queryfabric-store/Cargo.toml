[package]
name = "queryfabric-store"
description = "S3-compatible object store with presigned URLs, over OpenDAL"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true

[features]
default = ["memory"]
# In-process backend for tests and the demonstrator host.
memory = ["opendal/services-memory"]
# Any S3-compatible backend: AWS, MinIO, Garage, ...
s3 = [
    "opendal/services-s3",
    "opendal/http-transport-reqwest",
    "opendal/executors-tokio",
]

[dependencies]
opendal = { version = "0.58", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
