[package]
name = "queryfabric-demo"
description = "Self-host demonstrator: portable queries plus data sovereignty over Postgres and any S3-compatible store"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
async-trait = { workspace = true }
chrono = { workspace = true }
queryfabric = { workspace = true }
queryfabric-access = { workspace = true }
queryfabric-contract = { workspace = true }
queryfabric-federation = { workspace = true }
queryfabric-namespace-uuid = { workspace = true }
queryfabric-portability = { workspace = true }
queryfabric-paseto = { workspace = true }
queryfabric-provenance = { workspace = true }
queryfabric-store = { workspace = true, features = ["memory", "s3"] }
queryfabric-tenancy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tokio-postgres = { version = "0.7", features = [
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
] }
uuid = { workspace = true }
