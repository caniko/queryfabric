[package]
name = "queryfabric-web"
description = "Web-facing validation and static assets for QueryFabric"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["sql", "web", "validation", "analytics", "science"]
categories = ["web-programming", "database", "science"]

[dependencies]
http = { version = "1", optional = true }
queryfabric = { workspace = true }
queryfabric-catalog = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
urlencoding = "2"

[features]
default = []
ssr = ["dep:http", "dep:reqwest", "dep:serde_json"]

[dev-dependencies]
queryfabric-catalog = { workspace = true }
serde_json = { workspace = true }
