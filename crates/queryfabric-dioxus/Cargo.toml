[package]
name = "queryfabric-dioxus"
description = "Dioxus components and web support for QueryFabric SyQL"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["sql", "dioxus", "web", "validation", "analytics", "science"]
categories = ["web-programming", "gui", "database", "science"]

[dependencies]
dioxus = { workspace = true }
http = { version = "1", optional = true }
queryfabric = { workspace = true, optional = true }
queryfabric-catalog = { workspace = true, optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
serde = { workspace = true }
urlencoding = "2"
web-sys = { version = "0.3.102", optional = true, features = ["Location", "Window"] }

[features]
default = []
web = ["dioxus/web", "dep:web-sys"]
server = [
  "dioxus/fullstack",
  "dioxus/server",
  "dep:http",
  "dep:queryfabric",
  "dep:queryfabric-catalog",
  "dep:reqwest",
]

[dev-dependencies]
dioxus-ssr = "=0.7.9"
queryfabric-catalog = { workspace = true }
serde_json = { workspace = true }
