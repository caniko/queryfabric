[package]
name = "queryfabric-adapter-clickhouse"
description = "ClickHouse adapter for QueryFabric"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["sql", "clickhouse", "compiler", "analytics", "science"]
categories = ["database", "science"]

[dependencies]
arrow = { workspace = true }
arrow-ipc = { version = "58", features = ["lz4", "zstd"] }
async-trait = { workspace = true }
blake3 = { workspace = true }
clickhouse = "0.15"
futures = { workspace = true }
queryfabric-catalog = { workspace = true }
queryfabric-ir = { workspace = true }
queryfabric-runtime = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
queryfabric-dialect-sql = { workspace = true }
