[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Verified migration path"
description = "Bundle 2.0 and queryfabric.tabular-csv/1 define the exact bytes, schema, digests, limits, and diagnostics accepted by the reference importer."
highlight = true

[[pages.sections.features]]
title = "Failure-aware proof"
description = "The two-host VM check covers tampering, stale plans, rollback, cleanup, idempotent replay, restart, and query-after-import."

[[pages.sections.features]]
title = "Portable query boundary"
description = "Parse, bind, analyze, and emit a verified SQL/SyQL subset for PostgreSQL and ClickHouse without putting host policy in the compiler."

[[pages.sections.features]]
title = "Operator-controlled trust"
description = "The target host owns identity, authorization, local policy, target mapping, and the authenticated channel carrying the expected digest."

[[pages.sections.features]]
title = "Scientific origin"
description = "The compiler and portability contracts were extracted from scientific data-platform work into a neutral, reusable project."

[[pages.sections.features]]
title = "Pre-release honesty"
description = "The repository is reproducible, but no crates.io package, Codeberg release, production federation deployment, or external adoption is claimed yet."

[[pages.sections]]
type = "workflow_steps"
id = "proof"
heading = "Reproduce the proof"
intro = "Run these commands from the repository root in a Nix-enabled environment."

[[pages.sections.steps]]
title = "Run the migration VM"
description = "nix build .#checks.x86_64-linux.portability-migration --no-link -L"

[[pages.sections.steps]]
title = "Run the self-host VM"
description = "nix build .#checks.x86_64-linux.selfhost --no-link -L"

[[pages.sections.steps]]
title = "Review the release tier"
description = "nix develop -c scripts/release.sh plan"

[[pages.sections.steps]]
title = "Build the reviewer surface"
description = "nix build .#docs .#site --no-link"

[[pages.sections]]
type = "trust_panel"
id = "boundaries"
heading = "A bounded claim, by design"
intro = "The current proof is narrow enough to test completely. Future work is named separately instead of being folded into the present claim."

[[pages.sections.items]]
title = "One resource profile"
description = "The importer accepts one tabular CSV artifact and an exact predeclared target schema; it does not create arbitrary tables or migrate whole services."

[[pages.sections.items]]
title = "Integrity, not signatures"
description = "BLAKE3 content addressing detects changes relative to an expected digest supplied over an authenticated operator channel; there is no key-trust claim."

[[pages.sections.items]]
title = "Federation substrate, not product HA"
description = "Health, routing, registry, and schema-sync actors exist as libraries, but the demo does not yet wire them into a production federated service."

[[pages.sections.items]]
title = "Host-owned operations"
description = "PostgreSQL, object storage, identity, reverse proxy, TLS, authorization, and production policy remain operator responsibilities."

[[pages.sections]]
type = "trust_panel"
id = "demo"
heading = "Demo versus evidence"
intro = "The public demonstrator is a convenience surface. A reviewer should use the versioned repository and VM checks for acceptance evidence."

[[pages.sections.items]]
title = "Inspectable endpoints"
description = "The current source defines /healthz, /catalog, /resources, /query, export/bundle/data-rights routes, import dry-run/apply, and /federation/status."

[[pages.sections.items]]
title = "No deployment inference"
description = "A reachable demo does not prove that its binary matches the current repository; public evidence requires a visible matching revision and current import routes."

[[pages.sections.items]]
title = "No container claim"
description = "The supported deployment artifact is the NixOS module. No Docker/Podman image or oci-image flake output is currently published."

[[pages.sections.items]]
title = "Release evidence still pending"
description = "A signed tag, ten crates.io versions, a Codeberg release, manual accessibility review, and clean repeated footprint measurements remain release gates."

[[pages.sections]]
type = "trust_panel"
id = "operations"
heading = "Stable ownership boundaries"
intro = "QueryFabric owns portable compiler and migration mechanics. The embedding host owns decisions specific to users, infrastructure, and policy."

[[pages.sections.items]]
title = "Execution stays in the host"
description = "Routing, fan-out, authentication, jobs, backend execution, metadata policy, and tenancy decisions remain outside the compiler facade."

[[pages.sections.items]]
title = "Conformance is data-backed"
description = "The portable query subset and backend capabilities live in public machine-readable manifests rather than broad compatibility promises."

[[pages.sections.items]]
title = "Migration evidence is durable"
description = "The target records carried source evidence, local policy and owner, mapping, target import event, and an idempotent receipt in PostgreSQL."

[[pages.sections.items]]
title = "Future R&D is explicit"
description = "The roadmap separately scopes migration sets, typed schema rebinding, federation hardening, one measured embedded backend, and conditional ecosystem integration."
