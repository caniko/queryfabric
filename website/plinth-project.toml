[[pages.sections]]
type = "hero"
title = "QueryFabric"
tagline = "Move bounded analytical data between self-hosted services with verifiable integrity."
subtitle = "QueryFabric combines a portable SQL/SyQL compiler with a reproducible NixOS proof for export, operator-mediated transfer, dry-run, import, replay, restart, and tamper rejection between independently configured hosts."

[[pages.sections.ctas]]
label = "Inspect the evidence"
