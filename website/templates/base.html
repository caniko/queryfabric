<!DOCTYPE html>
<html lang="{{ config.default_language }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if section %}{{ section.title }} | {{ config.title }}{% else %}{{ config.title }}{% endif %}</title>
    <meta name="description" content="{{ config.description }}">
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <nav class="nav shell">
          <a class="brand" href="{{ config.base_url }}/">
            <span class="brand-mark">QF</span>
            <span class="brand-text">{{ config.title }}</span>
          </a>
          <div class="nav-links">
            <a href="{{ config.base_url }}/docs/">Documentation</a>
            <a href="https://codeberg.org/caniko/queryfabric">Source</a>
          </div>
        </nav>
      </header>

      <main>
        {% block content %}{% endblock content %}
      </main>

      <footer class="site-footer">
        <div class="shell footer-inner">
          <p>{{ config.title }} is a portable analytical query compiler for scientific platforms.</p>
          <p>Apache-2.0. Source on <a href="https://codeberg.org/caniko/queryfabric">Codeberg</a>.</p>
        </div>
      </footer>
    </div>
  </body>
</html>
