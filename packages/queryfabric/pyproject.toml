[project]
name = "queryfabric"
version = "0.1.0"
description = "Python bindings for the QueryFabric facade"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.maturin]
module-name = "queryfabric._queryfabric"
python-source = "python"
manifest-path = "../../crates/queryfabric-python/Cargo.toml"
