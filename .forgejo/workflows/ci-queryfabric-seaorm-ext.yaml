# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeberg-tiny:
    runs-on: codeberg-tiny
    container: rust:bookworm
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Cache cargo bin (tools)
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-${{ hashFiles('.forgejo/workflows/*.yaml') }}

      - name: Format check
        run: cargo fmt --all -- --check

  codeberg-medium:
    needs: [codeberg-tiny]
    runs-on: codeberg-medium
    container: rust:bookworm
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Cache cargo bin (tools)
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-${{ hashFiles('.forgejo/workflows/*.yaml') }}

      - name: Test
        run: cargo test -p queryfabric-seaorm-ext

      - name: Package crate
        run: cargo package -p queryfabric-seaorm-ext
  codeberg-small:
    needs: [codeberg-tiny]
    runs-on: codeberg-small
    container: rust:bookworm
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Cache cargo bin (tools)
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-${{ hashFiles('.forgejo/workflows/*.yaml') }}

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked --version 0.18.3

      - name: Build docs
        run: cargo doc --no-deps --all-features

      - name: Clippy
        run: cargo clippy -p queryfabric-seaorm-ext --all-targets -- --deny warnings
