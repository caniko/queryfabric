name: ci

on:
  push:
  pull_request:

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo fmt (fuzz)
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: cargo test
        run: cargo test --workspace --all-targets
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: cargo fmt (fuzz)
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - name: cargo fuzz build parse_sql_no_panic
        working-directory: fuzz
        run: cargo fuzz build parse_sql_no_panic
      - name: cargo fuzz build bind_portable_no_panic
        working-directory: fuzz
        run: cargo fuzz build bind_portable_no_panic
