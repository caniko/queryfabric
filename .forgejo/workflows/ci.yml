name: ci

on:
  push:
  pull_request:

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: https://github.com/dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo fmt (fuzz)
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets --exclude queryfabric-python
      - name: queryfabric-python compile check
        run: cargo check -p queryfabric-python --locked
      - name: reuse lint
        run: nix develop -c reuse lint
      - name: publish workflow metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.publish == null or (.publish | length) > 0) | .name' \
            | sort > "$tmp/metadata"
          find .forgejo/workflows -maxdepth 1 -name 'publish-crate-*.yaml' -printf '%f\n' \
            | sed -e 's/^publish-crate-//' -e 's/\.yaml$//' \
            | sort > "$tmp/workflows"
          diff -u "$tmp/metadata" "$tmp/workflows"
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: https://github.com/dtolnay/rust-toolchain@89428adc381502888d30f3ce6abbb7ea52739d01 # 1.94.0
      - name: cargo test
        run: cargo test --workspace --all-targets --exclude queryfabric-python
      - name: queryfabric-python compile check
        run: cargo check -p queryfabric-python --locked
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: https://github.com/dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: cargo fmt (fuzz)
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - name: cargo fuzz build parse_sql_no_panic
        working-directory: fuzz
        run: cargo fuzz build parse_sql_no_panic
      - name: cargo fuzz build bind_portable_no_panic
        working-directory: fuzz
        run: cargo fuzz build bind_portable_no_panic
