[workspace]
resolver = "3"
members = [
    "crates/queryfabric",
    "crates/queryfabric-ir",
    "crates/queryfabric-catalog",
    "crates/queryfabric-runtime",
    "crates/queryfabric-opt",
    "crates/queryfabric-dialect-sql",
    "crates/queryfabric-dialect-syql",
    "crates/queryfabric-web",
    "crates/queryfabric-leptos",
    "crates/queryfabric-dioxus",
    "crates/queryfabric-adapter-clickhouse",
    "crates/queryfabric-adapter-postgres",
    "crates/queryfabric-python",
    "crates/queryfabric-contract",
    "crates/queryfabric-paseto",
    "crates/queryfabric-session",
    "crates/queryfabric-problem-details",
    "crates/queryfabric-namespace-uuid",
    "crates/queryfabric-flight-pool",
    "crates/queryfabric-flight-cache",
    "crates/queryfabric-tcp-tuned",
    "crates/queryfabric-job-queue",
    "crates/queryfabric-prom",
    "crates/queryfabric-content-hash",
    "crates/queryfabric-fetch",
    "crates/queryfabric-release",
    "crates/queryfabric-cli-toolbelt",
    "crates/queryfabric-cmd-runner",
    "crates/queryfabric-test-rig",
    "crates/queryfabric-cluster",
    "crates/queryfabric-federation",
    "crates/queryfabric-provenance",
    "crates/queryfabric-access",
    "crates/queryfabric-portability",
    "crates/queryfabric-tenancy",
    "crates/queryfabric-store",
    "crates/queryfabric-demo",
    "crates/queryfabric-runtime-k8s",
    "crates/queryfabric-seaorm-ext",
    "crates/queryfabric-changelog",
    "crates/queryfabric-worker",
    "crates/queryfabric-types",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://codeberg.org/caniko/queryfabric"
homepage = "https://codeberg.org/caniko/queryfabric"
documentation = "https://docs.rs/queryfabric"
rust-version = "1.94"

[workspace.dependencies]
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
libp2p-identity = "0.2"
papaya = "0.2"
secrecy = { version = "0.10", features = ["serde"] }
piying = { version = "0.1.1", features = [
    "remote",
    "serde-codec",
] }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2.0"
arrow = { version = "59", default-features = false }
async-trait = "0.1"
futures = "0.3"
miette = { version = "7", features = ["fancy"] }
sqlparser = { version = "0.61", features = ["serde"] }
thiserror = "2"
tokio-util = "0.7"
pyo3 = "0.29"
pythonize = "0.29"
sea-orm = { version = "2.0.0-rc.41", default-features = false, features = ["macros", "with-json", "with-uuid"] }
uuid = { version = "1", features = ["v7"] }

queryfabric = { version = "0.2.0", path = "crates/queryfabric" }
queryfabric-ir = { version = "0.2.0", path = "crates/queryfabric-ir" }
queryfabric-catalog = { version = "0.2.0", path = "crates/queryfabric-catalog" }
queryfabric-runtime = { version = "0.2.0", path = "crates/queryfabric-runtime" }
queryfabric-runtime-k8s = { version = "0.1.0", path = "crates/queryfabric-runtime-k8s" }
queryfabric-opt = { version = "0.2.0", path = "crates/queryfabric-opt" }
queryfabric-dialect-sql = { version = "0.2.0", path = "crates/queryfabric-dialect-sql" }
queryfabric-dialect-syql = { version = "0.2.0", path = "crates/queryfabric-dialect-syql" }
queryfabric-web = { version = "0.2.0", path = "crates/queryfabric-web" }
queryfabric-leptos = { version = "0.2.0", path = "crates/queryfabric-leptos" }
queryfabric-dioxus = { version = "0.2.0", path = "crates/queryfabric-dioxus" }
queryfabric-adapter-clickhouse = { version = "0.2.0", path = "crates/queryfabric-adapter-clickhouse" }
queryfabric-adapter-postgres = { version = "0.2.0", path = "crates/queryfabric-adapter-postgres" }
queryfabric-contract = { version = "0.2.0", path = "crates/queryfabric-contract" }
queryfabric-paseto = { version = "0.2.0", path = "crates/queryfabric-paseto" }
queryfabric-session = { version = "0.2.0", path = "crates/queryfabric-session" }
queryfabric-problem-details = { version = "0.2.0", path = "crates/queryfabric-problem-details" }
queryfabric-namespace-uuid = { version = "0.2.0", path = "crates/queryfabric-namespace-uuid" }
queryfabric-flight-pool = { version = "0.2.0", path = "crates/queryfabric-flight-pool" }
queryfabric-flight-cache = { version = "0.2.0", path = "crates/queryfabric-flight-cache" }
queryfabric-tcp-tuned = { version = "0.2.0", path = "crates/queryfabric-tcp-tuned" }
queryfabric-job-queue = { version = "0.2.0", path = "crates/queryfabric-job-queue" }
queryfabric-prom = { version = "0.2.0", path = "crates/queryfabric-prom" }
queryfabric-content-hash = { version = "0.2.0", path = "crates/queryfabric-content-hash" }
queryfabric-fetch = { version = "0.2.0", path = "crates/queryfabric-fetch" }
queryfabric-cli-toolbelt = { version = "0.2.0", path = "crates/queryfabric-cli-toolbelt" }
queryfabric-cmd-runner = { version = "0.2.0", path = "crates/queryfabric-cmd-runner" }
queryfabric-test-rig = { version = "0.2.0", path = "crates/queryfabric-test-rig" }
queryfabric-cluster = { version = "0.2.0", path = "crates/queryfabric-cluster" }
queryfabric-federation = { version = "0.2.0", path = "crates/queryfabric-federation" }
queryfabric-provenance = { version = "0.2.0", path = "crates/queryfabric-provenance" }
queryfabric-access = { version = "0.2.0", path = "crates/queryfabric-access" }
queryfabric-portability = { version = "0.2.0", path = "crates/queryfabric-portability" }
queryfabric-tenancy = { version = "0.2.0", path = "crates/queryfabric-tenancy" }
queryfabric-store = { version = "0.2.0", path = "crates/queryfabric-store" }
queryfabric-seaorm-ext = { version = "0.1.0", path = "crates/queryfabric-seaorm-ext" }
queryfabric-changelog = { version = "0.1.0", path = "crates/queryfabric-changelog" }
queryfabric-types = { version = "0.1.0", path = "crates/queryfabric-types" }
queryfabric-worker = { version = "0.1.0", path = "crates/queryfabric-worker" }
leptos = { version = "=0.8.19", default-features = false }
dioxus = { version = "=0.7.9", default-features = false, features = ["lib"] }
# Dioxus 0.7.9's web history path calls Window::location without enabling the
# corresponding web-sys feature through its renderer dependency.
web-sys = { version = "0.3.102", features = ["Window", "Location"] }
